<!DOCTYPE html>
  <html lang="tr">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zula - E-posta Adresi Onaylandi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
  :root { --primary: #059669; --accent: #10b981; --bg: #090d16; --surface-card: #162032; --border: #1f293d; --text: #f3f4f6; --text-muted: #94a3b8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
.card { background-color: var(--surface-card); border: 1px solid var(--border); border-radius: 24px; padding: 48px 32px; max-width: 440px; width: 100%; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
.icon-container { width: 80px; height: 80px; background-color: rgba(16,185,129,0.15); border: 2px solid var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px auto; }
.icon-container svg { width: 40px; height: 40px; stroke: var(--accent); }
h1 { font-size: 24px; font-weight: 700; margin-bottom: 12px; color: #ffffff; }
p { font-size: 15px; color: var(--text-muted); line-height: 1.6; margin-bottom: 32px; }
.badge { display: inline-block; padding: 6px 16px; background-color: rgba(16,185,129,0.1); color: var(--accent); border-radius: 20px; font-size: 13px; font-weight: 600; margin-bottom: 24px; }
.footer-text { font-size: 13px; color: #64748b; }
</style>
  </head>
  <body>
  <div class="card">
  <div class="badge">Zula Hesabi</div>
  <div class="icon-container">
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
  <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
  </svg>
  </div>
  <h1>E-posta Adresiniz Onaylandi!</h1>
  <p>Hesabiniz basariyla dogrulandi. Artik Zula mobil uygulamasina donebilir ve hesabiniza giris yapabilirsiniz.</p>
  <div class="footer-text">&copy; Zula - Akilli Mutfak ve Stok Takibi</div>
</div>
</body>
</html>
